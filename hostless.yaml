# Hostless deployment configuration for the IRMS Express API.
# Database credentials remain in Hostless environment variables, never here.
working_directory: restaurant-system/backend

build:
  system: auto
  command: npm ci --omit=dev

start_command: npm start

scaling:
  min_replicas: 1
  max_replicas: 1
  min_cpu: 0.1
  max_cpu: 0.1
  min_memory: 256
  max_memory: 256

health_check:
  type: http
  http_path: /health
  interval_in_seconds: 20
